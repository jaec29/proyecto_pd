[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "proyecto_pd"
version = "0.0.1"
description = "Proyecto del curso Product Development - Maestria BI"
authors = [
  { name = "Javier Estrada Cordon" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10"


[tool.ruff]
line-length = 99
src = ["proyecto_pd"]
include = ["pyproject.toml", "proyecto_pd/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["proyecto_pd"]
force-sort-within-sections = true

